services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: africaptions
      POSTGRES_PASSWORD: africaptions
      POSTGRES_DB: africaptions
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U africaptions']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://africaptions:africaptions@db:5432/africaptions
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
